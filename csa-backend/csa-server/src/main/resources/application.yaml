spring:
  application:
    name: csa-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/csa_portal?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: csa-portal-jwt-secret-key-2026-must-be-at-least-256-bits-long
  expiration: 86400000

