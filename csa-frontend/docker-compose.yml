version: '3.8'

services:
  # ---------- 后端 ----------
  backend:
    build:
      context: ../csa-backend
      dockerfile: Dockerfile
    container_name: csa-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - csa-net
    restart: unless-stopped

  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: csa-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: csa
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../csa-ddl.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - csa-net
    restart: unless-stopped

  # ---------- 前端 ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csa-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - csa-net
    restart: unless-stopped

networks:
  csa-net:
    driver: bridge

volumes:
  mysql-data:
